<style>

.chip{padding:9px 14px;border-radius:100px;border:1px solid var(--line);background:transparent;color:var(--paper);font-size:13px}
.chip.on{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.score{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.pl{background:var(--ink2);border:1px solid var(--line);border-radius:14px;padding:10px 14px}

.back{background:var(--paper);color:var(--ink);transform:rotateY(180deg)}

.q{font:500 20px/1.38 Fraunces,serif;margin:0}
.meta{font-size:12px;color:rgba(23,30,43,.5);font-weight:600}

.btn{border:0;border-radius:100px;padding:14px 22px;font-size:15px}
.main{background:var(--amber);color:var(--ink);width:100%;box-shadow:0 8px 24px -8px rgba(227,161,61,.5)}

.row .btn.on{border-color:var(--amber);color:var(--amber2)}
#judge{margin-top:10px}#judge[hidden]{display:none}
.left{text-align:center;font-size:13px;color:var(--dim);margin:14px 0}
textarea,select{width:100%;background:var(--ink);color:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px;font:14px Manrope,sans-serif;margin-top:8px}
.mini{background:var(--amber);color:var(--ink);padding:10px 16px;margin-top:8px;font-size:14px}
ul{padding-left:18px;font-size:14px;line-height:1.5;color:var(--dim)}

@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style></head><body><div class="wrap">
<div class="brand">Small <span>Talk</span> v2</div>

<details>
<summary>Настройки игры</summary>
<label class="sw"><input type="checkbox" checked disabled><span>Тёплый уровень<small>всегда включён</small></span></label>
<label class="sw"><input type="checkbox" id="flirt"><span>Флирт<small>включён по умолчанию</small></span></label>
<label class="sw"><input type="checkbox" id="hot"><span>Горячий уровень<small>включайте, только если хотите оба. После перезагрузки выключается снова.</small></span></label>
<label class="sw"><input type="checkbox" id="esc"><span>Нарастание<small>флирт открывается после 6 карточек, горячий после 12</small></span></label>
<label class="sw"><input type="checkbox" id="guess"><span>Режим «угадай»<small>партнёр угадывает ответ, потом отвечает тот, кто тянул</small></span></label>
</details>

<div class="chips" id="chips">
<button class="chip on" data-c="all">Все</button><button class="chip" data-c="l">Лёгкие</button><button class="chip" data-c="d">Глубокие</button><button class="chip" data-c="f">Смешные</button><button class="chip" data-c="t">Для двоих</button><button class="chip" data-c="a">Действия</button>
</div>

<div class="score">
<div class="pl" id="p0"><input id="n0" aria-label="Имя первого игрока"><div id="s0"></div></div>
<div class="pl" id="p1"><input id="n1" aria-label="Имя второго игрока"><div id="s1"></div></div>
</div>
<p class="turn" id="turn">Нажми на карточку, чтобы начать</p>

<div class="stage"><div class="card" id="card" tabindex="0" role="button" aria-label="Тянуть карточку">
<div class="face front"><div class="m">Small Talk</div><div class="q" style="color:var(--paper)">Нажми на карточку, чтобы вытянуть вопрос</div></div>
<div class="face back"><span class="cat" id="cat"></span><p class="q" id="q"></p><div class="meta" id="meta"></div></div>
</div></div>
<p class="hint">Прочитали? Положите телефон экраном вниз и поговорите.</p>

<button class="btn main" id="draw">Тянуть карточку</button>
<div class="row"><button class="btn" id="pas">Пас</button><button class="btn" id="veto">Вето</button></div>
<div class="row" id="judge" hidden><button class="btn" id="yes">Угадал(а)</button><button class="btn" id="no">Мимо</button></div>
<div class="left" id="left"></div>

<details><summary>Новая игра</summary><p style="font-size:14px;color:var(--dim)">Сбросит счёт, жетоны и историю показанных карточек. Карточки с вето останутся скрытыми.</p><button class="btn mini" id="reset">Начать заново</button></details>
</div>

  $('q').textContent=c.q;
  $('meta').textContent=end?'':'осталось '+pool(1).length;
  const name=S.names[turn]||'Игрок',other=S.names[1-turn]||'Игрок';
  $('turn').textContent=end?'':(c.c=='a'||c.c=='x')?'Выполняет: '+name:S.guess?'Отвечает: '+name+' · угадывает: '+other:'Ход: '+name;
  $('judge').hidden=!(S.guess&&!end&&c.c!='a'&&c.c!='x');
  const card=$('card');
  if(flipped){card.classList.remove('flip');void card.offsetWidth}
  requestAnimationFrame(()=>{card.classList.add('flip');flipped=true});
  renderPl();
}
function draw(keep){
  let p=pool();if(!p.length)p=pool(1);
  if(!p.length){show({c:'x',v:0,q:'Колода закончилась. Откройте другой уровень или начните заново.'},true);return}
  const A=p.filter(x=>x.c=='a'),Q=p.filter(x=>x.c!='a');
  const c=(S.cat=='all'&&A.length&&(!Q.length||Math.random()<.2))?pick(A):pick(Q.length?Q:A);
  if(cur&&!keep)turn^=1;
  seen.add(c.q);sv('seen',[...seen]);drawn++;
  show(c);
}
$('draw').onclick=()=>draw();
$('card').onclick=()=>draw();
$('card').onkeydown=e=>{if(e.key=='Enter'||e.key==' '){e.preventDefault();draw()}};
$('pas').onclick=()=>{
  if(!cur)return;
  if(tok[turn]>0){tok[turn]--;draw(true)}else show({c:'x',v:0,q:pick(FORF)});
};
$('veto').onclick=()=>{if(!cur)return;veto.add(cur.q);sv('veto',[...veto]);draw(true)};
$('yes').onclick=()=>{score[1-turn]++;$('judge').hidden=true;renderPl()};
$('no').onclick=()=>{$('judge').hidden=true};
$('chips').onclick=e=>{
  const b=e.target.closest('.chip');if(!b)return;
  document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  S.cat=b.dataset.c;renderPl();
};
['flirt','esc','guess'].forEach(k=>{$(k).checked=S[k];$(k).onchange=e=>{S[k]=e.target.checked;save();renderPl()}});
$('hot').onchange=e=>{
  if(e.target.checked&&!confirm('Горячий уровень включается только если вы оба этого хотите. Включить?'))e.target.checked=false;
  S.hot=e.target.checked;renderPl();
};
[0,1].forEach(i=>{$('n'+i).value=S.names[i];$('n'+i).oninput=e=>{S.names[i]=e.target.value;save()}});
$('reset').onclick=()=>{seen.clear();sv('seen',[]);score=[0,0];tok=[2,2];drawn=0;cur=null;turn=0;$('card').classList.remove('flip');flipped=false;$('turn').textContent='Нажми на карточку, чтобы начать';$('judge').hidden=true;renderPl()};
renderPl();
</script></body></html>
